name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle & KSP flags
        run: |
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Djava.awt.headless=true -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          org.gradle.workers.max=1
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          kotlin.compiler.execution.strategy=in-process
          googleServices.missing.passthrough=true
          ksp.incremental=false
          ksp.use.worker.api=false
          EOF

      - name: Generate temporary debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
